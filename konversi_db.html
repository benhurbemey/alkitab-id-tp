<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konversi Alkitab ID & TP - Bilingual</title>
<style>
  body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #f4f4f4; }
  .card { background: white; border: 1px solid #ddd; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
  button { background: #4CAF50; color: white; padding: 15px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; }
  button:disabled { background: #ccc; }
  input[type="file"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; background: #fafafa; }
  .status { padding: 15px; border-radius: 5px; margin-top: 15px; font-weight: bold; text-align: center; }
  .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
  .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
  h2 { color: #333; margin-top: 0; }
  p { color: #666; font-size: 14px; }
  label { font-weight: bold; display: block; margin-top: 10px; color: #333; }
  .preview { background: #f8f9fa; padding: 10px; border-radius: 5px; font-size: 12px; max-height: 200px; overflow: auto; margin-top: 10px; }
</style>
</head>
<body>
  <div class="card">
    <h2>📖 Konversi Alkitab Dwi-Bahasa</h2>
    <p>Script ini akan menggabungkan database <b>Indonesia (flat)</b> dan <b>Tok Pisin (nested)</b> menjadi satu file bilingual.</p>
    
    <label>🇮🇩 File Database Indonesia (indo_tb.json):</label>
    <input type="file" id="fileID" accept=".json">
    
    <label>🇵🇬 File Database Tok Pisin (tok_pisin.json):</label>
    <input type="file" id="fileTP" accept=".json">
    
    <button id="btnConvert" onclick="convert()">🔄 Konversi & Download Bilingual JSON</button>
    
    <div id="status"></div>
    <div id="preview" style="display:none;">
      <h3>Preview Hasil (Kitab 1 - Kejadian/Genesis):</h3>
      <div class="preview" id="previewText"></div>
    </div>
  </div>

<script>
// Mapping nama kitab English (TP) ke nomor kitab (1-66)
const tpBookNameToNumber = {
  'Genesis': 1, 'Exodus': 2, 'Leviticus': 3, 'Numbers': 4, 'Deuteronomy': 5,
  'Joshua': 6, 'Judges': 7, 'Ruth': 8, '1 Samuel': 9, '2 Samuel': 10,
  '1 Kings': 11, '2 Kings': 12, '1 Chronicles': 13, '2 Chronicles': 14,
  'Ezra': 15, 'Nehemiah': 16, 'Esther': 17, 'Job': 18, 'Psalms': 19,
  'Proverbs': 20, 'Ecclesiastes': 21, 'Song of Solomon': 22, 'Isaiah': 23,
  'Jeremiah': 24, 'Lamentations': 25, 'Ezekiel': 26, 'Daniel': 27,
  'Hosea': 28, 'Joel': 29, 'Amos': 30, 'Obadiah': 31, 'Jonah': 32,
  'Micah': 33, 'Nahum': 34, 'Habakkuk': 35, 'Zephaniah': 36,
  'Haggai': 37, 'Zechariah': 38, 'Malachi': 39,
  'Matthew': 40, 'Mark': 41, 'Luke': 42, 'John': 43, 'Acts': 44,
  'Romans': 45, '1 Corinthians': 46, '2 Corinthians': 47, 'Galatians': 48,
  'Ephesians': 49, 'Philippians': 50, 'Colossians': 51, '1 Thessalonians': 52,
  '2 Thessalonians': 53, '1 Timothy': 54, '2 Timothy': 55, 'Titus': 56,
  'Philemon': 57, 'Hebrews': 58, 'James': 59, '1 Peter': 60,
  '2 Peter': 61, '1 John': 62, '2 John': 63, '3 John': 64,
  'Jude': 65, 'Revelation': 66
};

const idBookNames = {
  1:'Kejadian',2:'Keluaran',3:'Imamat',4:'Bilangan',5:'Ulangan',
  6:'Yosua',7:'Hakim-hakim',8:'Rut',9:'1 Samuel',10:'2 Samuel',
  11:'1 Raja-raja',12:'2 Raja-raja',13:'1 Tawarikh',14:'2 Tawarikh',
  15:'Ezra',16:'Nehemia',17:'Ester',18:'Ayub',19:'Mazmur',
  20:'Amsal',21:'Pengkhotbah',22:'Kidung Agung',23:'Yesaya',
  24:'Yeremia',25:'Ratapan',26:'Yehezkiel',27:'Daniel',
  28:'Hosea',29:'Yoel',30:'Amos',31:'Obaja',32:'Yunus',
  33:'Mikha',34:'Nahum',35:'Habakuk',36:'Zefanya',
  37:'Hagai',38:'Zakharia',39:'Maleakhi',
  40:'Matius',41:'Markus',42:'Lukas',43:'Yohanes',44:'Kisah Para Rasul',
  45:'Roma',46:'1 Korintus',47:'2 Korintus',48:'Galatia',
  49:'Efesus',50:'Filipi',51:'Kolose',52:'1 Tesalonika',
  53:'2 Tesalonika',54:'1 Timotius',55:'2 Timotius',56:'Titus',
  57:'Filemon',58:'Ibrani',59:'Yakobus',60:'1 Petrus',
  61:'2 Petrus',62:'1 Yohanes',63:'2 Yohanes',64:'3 Yohanes',
  65:'Yudas',66:'Wahyu'
};

const tpBookNames = {
  1:'Jenesis',2:'Eksodos',3:'Livitikas',4:'Namba',5:'Deuterenomi',
  6:'Josua',7:'Jajes',8:'Rut',9:'1 Samuel',10:'2 Samuel',
  11:'1 King',12:'2 King',13:'1 Kronicol',14:'2 Kronicol',
  15:'Ezra',16:'Nehamaia',17:'Esta',18:'Job',19:'Sam',
  20:'Provabs',21:'Preca',22:'Song Bilong Songs',23:'Aisaia',
  24:'Jeremaia',25:'Lamentesen',26:'Isikol',27:'Daniel',
  28:'Hosia',29:'Joel',30:'Amos',31:'Obadia',32:'Jona',
  33:'Maika',34:'Nahum',35:'Habakuk',36:'Zefanaia',
  37:'Hagai',38:'Sekaraia',39:'Malakai',
  40:'Matiu',41:'Mak',42:'Luk',43:'Jon',44:'Ol Wok',
  45:'Rom',46:'1 Korin',47:'2 Korin',48:'Galasia',
  49:'Efesus',50:'Filipai',51:'Kolosi',52:'1 Tesalonaika',
  53:'2 Tesalonaika',54:'1 Timoti',55:'2 Timoti',56:'Taitus',
  57:'Filemon',58:'Hibru',59:'Jemes',60:'1 Pita',
  61:'2 Pita',62:'1 Jon',63:'2 Jon',64:'3 Jon',65:'Jud',66:'Revelesen'
};

const osisIds = ['GEN','EXO','LEV','NUM','DEU','JOS','JDG','RUT','1SA','2SA',
  '1KI','2KI','1CH','2CH','EZR','NEH','EST','JOB','PSA','PRO',
  'ECC','SNG','ISA','JER','LAM','EZK','DAN','HOS','JOL','AMO',
  'OBA','JON','MIC','NAM','HAB','ZEP','HAG','ZEC','MAL',
  'MAT','MRK','LUK','JHN','ACT','ROM','1CO','2CO','GAL','EPH',
  'PHP','COL','1TH','2TH','1TI','2TI','TIT','PHM','HEB','JAS',
  '1PE','2PE','1JN','2JN','3JN','JUD','REV'];

function readFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(JSON.parse(e.target.result));
    reader.onerror = reject;
    reader.readAsText(file);
  });
}

function showStatus(msg, type='info') {
  document.getElementById('status').innerHTML = `<div class="status ${type}">${msg}</div>`;
}

// Parse database Indonesia (format flat)
function parseIndonesia(data) {
  const verses = data.verses || data;
  const db = {};
  verses.forEach(v => {
    const bookNum = v.book;
    const chapter = v.chapter;
    const verseNum = v.verse;
    if (!db[bookNum]) db[bookNum] = {};
    if (!db[bookNum][chapter]) db[bookNum][chapter] = {};
    db[bookNum][chapter][verseNum] = v.text;
  });
  return db;
}

// Parse database Tok Pisin (format nested)
function parseTokPisin(data) {
  const db = {};
  data.books.forEach(book => {
    const bookName = book.name;
    const bookNum = tpBookNameToNumber[bookName];
    if (!bookNum) {
      console.warn(`Warning: Kitab "${bookName}" tidak ditemukan di mapping!`);
      return;
    }
    if (!db[bookNum]) db[bookNum] = {};
    book.chapters.forEach(chap => {
      const chapNum = chap.chapter;
      if (!db[bookNum][chapNum]) db[bookNum][chapNum] = {};
      chap.verses.forEach(v => {
        db[bookNum][chapNum][v.verse] = v.text;
      });
    });
  });
  return db;
}

async function convert() {
  const fileID = document.getElementById('fileID').files[0];
  const fileTP = document.getElementById('fileTP').files[0];
  
  if (!fileID || !fileTP) {
    showStatus('⚠️ Pilih kedua file database terlebih dahulu!', 'error');
    return;
  }
  
  showStatus('⏳ Memproses database...');
  document.getElementById('btnConvert').disabled = true;
  
  try {
    const [dataID, dataTP] = await Promise.all([readFile(fileID), readFile(fileTP)]);
    
    const dbID = parseIndonesia(dataID);
    const dbTP = parseTokPisin(dataTP);
    
    const result = [];
    for (let bookNum = 1; bookNum <= 66; bookNum++) {
      const chaptersID = dbID[bookNum] || {};
      const chaptersTP = dbTP[bookNum] || {};
      const allChapters = [...new Set([...Object.keys(chaptersID), ...Object.keys(chaptersTP)].map(Number))].sort((a,b)=>a-b);
      
      const chapters = allChapters.map(chapNum => {
        const vID = chaptersID[chapNum] || {};
        const vTP = chaptersTP[chapNum] || {};
        const allVerses = [...new Set([...Object.keys(vID), ...Object.keys(vTP)].map(Number))].sort((a,b)=>a-b);
        
        return {
          number: chapNum,
          verses: allVerses.map(vNum => ({
            number: vNum,
            id: vID[vNum] || null,
            tp: vTP[vNum] || null
          }))
        };
      });
      
      result.push({
        id: osisIds[bookNum-1],
        name_id: idBookNames[bookNum],
        name_tp: tpBookNames[bookNum],
        testament: bookNum <= 39 ? 'PL' : 'PB',
        order: bookNum,
        chapters
      });
    }
    
    const jsonStr = JSON.stringify(result, null, 2);
    
    // Download
    const blob = new Blob([jsonStr], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'alkitab_bilingual.json';
    a.click();
    URL.revokeObjectURL(url);
    
    // Preview
    document.getElementById('preview').style.display = 'block';
    document.getElementById('previewText').textContent = JSON.stringify(result[0], null, 2);
    
    showStatus(`✅ Berhasil! 66 kitab dikonversi. File "alkitab_bilingual.json" sudah terdownload.`, 'success');
  } catch (err) {
    showStatus(`❌ Error: ${err.message}`, 'error');
    console.error(err);
  }
  
  document.getElementById('btnConvert').disabled = false;
}
</script>
</body>
</html>
